<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceder · Aminos MX</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0f16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem('amx_theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
<script src="js/config.js"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="molecule-bg" style="position:absolute;inset:0;opacity:.5"></div>
  <div class="glow-blob" style="position:absolute;top:-140px;left:50%;width:760px;height:460px;transform:translateX(-50%);border-radius:50%;opacity:.22;filter:blur(64px);background:radial-gradient(ellipse at center, hsl(174 84% 45% / .55) 0%, hsl(199 89% 48% / .25) 45%, transparent 70%)"></div>

  <div class="auth-card">
    <a class="brand" href="/" style="display:inline-flex;align-items:center;gap:10px;margin-bottom:18px">
      <span class="brand-mark"><svg class="ico"><use href="#i-dna"/></svg></span>
      <span class="brand-name">Aminos<span class="mx">MX</span></span>
    </a>

    <h1 id="authTitle">Entra a tu cuenta</h1>
    <p class="lead" id="authLead">Consulta tus pedidos y sigue tus envíos en tiempo real.</p>

    <div class="social-login" id="socialLogin" hidden>
      <button type="button" class="btn-social" id="googleBtn">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continuar con Google
      </button>
    </div>
    <div class="auth-divider" id="authDivider" hidden>o con tu correo</div>

    <div class="auth-tabs" role="tablist">
      <button type="button" class="active" data-mode="signin">Iniciar sesión</button>
      <button type="button" data-mode="signup">Crear cuenta</button>
    </div>

    <form class="auth-form" id="authForm" novalidate>
      <div class="field" id="nameField" hidden>
        <label for="fullName">Nombre completo</label>
        <input class="input" type="text" id="fullName" autocomplete="name" placeholder="Tu nombre">
      </div>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input class="input" type="email" id="email" required autocomplete="email" placeholder="tu@correo.com">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input class="input" type="password" id="password" required autocomplete="current-password"
               minlength="8" placeholder="Mínimo 8 caracteres">
      </div>
      <div id="authMsg" role="status" aria-live="polite"></div>
      <button class="btn btn-primary btn-lg btn-block" type="submit" id="submitBtn">Iniciar sesión</button>
    </form>

    <div class="auth-alt">
      <a href="#" id="magicLink">Prefiero recibir un enlace por correo</a>
    </div>
    <div class="auth-alt" id="forgotWrap" style="margin-top:10px">
      <a href="#" id="forgotLink">Olvidé mi contraseña</a>
    </div>
    <div class="auth-alt" style="margin-top:10px">
      <a href="/">← Volver a la tienda</a> · <a href="/seguimiento">Rastrear pedido sin cuenta</a>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from './js/db.js';
  import { injectIcons } from './js/icons.js';
  injectIcons();

  const $ = (s) => document.querySelector(s);
  const form = $('#authForm'), msg = $('#authMsg'), btn = $('#submitBtn');
  // `next` viene de la URL: solo aceptamos rutas internas. Sin este filtro,
  // ?next=https://sitio-falso.mx mandaría al cliente recién autenticado a un
  // dominio ajeno (redirect abierto). `//host` también es absoluta.
  const rawNext = new URLSearchParams(location.search).get('next') || '';
  const next = /^\/(?!\/)/.test(rawNext) ? rawNext : '/cuenta';
  let mode = 'signin';

  // Si ya hay sesión, entrar directo
  supabase.auth.getSession().then(({ data }) => { if (data.session) location.replace(next); });

  document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach((x) => x.classList.toggle('active', x === b));
    $('#nameField').hidden = mode !== 'signup';
    $('#authTitle').textContent = mode === 'signup' ? 'Crea tu cuenta' : 'Entra a tu cuenta';
    $('#authLead').textContent = mode === 'signup'
      ? 'Guarda tus datos de envío y sigue cada pedido desde tu panel.'
      : 'Consulta tus pedidos y sigue tus envíos en tiempo real.';
    btn.textContent = mode === 'signup' ? 'Crear cuenta' : 'Iniciar sesión';
    $('#password').autocomplete = mode === 'signup' ? 'new-password' : 'current-password';
    msg.innerHTML = '';
  }));

  const show = (text, ok = false) => {
    msg.innerHTML = `<p class="${ok ? 'ok-text' : 'error-text'}">${text}</p>`;
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('#email').value.trim();
    const password = $('#password').value;
    if (!email || password.length < 8) return show('Revisa tu correo y una contraseña de 8+ caracteres.');

    btn.disabled = true; btn.textContent = 'Un momento…';
    try {
      if (mode === 'signup') {
        const { error } = await supabase.auth.signUp({
          email, password,
          options: { data: { full_name: $('#fullName').value.trim() },
                     emailRedirectTo: location.origin + next },
        });
        if (error) throw error;
        show('¡Listo! Revisa tu correo para confirmar la cuenta.', true);
      } else {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        location.href = next;
      }
    } catch (err) {
      show(err?.message === 'Invalid login credentials'
        ? 'Correo o contraseña incorrectos.' : (err?.message ?? 'No pudimos completar la operación.'));
    } finally {
      btn.disabled = false;
      btn.textContent = mode === 'signup' ? 'Crear cuenta' : 'Iniciar sesión';
    }
  });

  // El botón de Google se enciende solo cuando el proveedor está activo en
  // Supabase (Authentication → Providers → Google): activarlo allá lo
  // muestra aquí sin tocar código, y mientras tanto nadie aterriza en la
  // página de error de un proveedor apagado.
  fetch(`${window.AMX_CONFIG.SUPABASE_URL}/auth/v1/settings`, {
    headers: { apikey: window.AMX_CONFIG.SUPABASE_KEY },
  }).then((r) => r.json()).then((s) => {
    if (s?.external?.google) {
      $('#socialLogin').hidden = false;
      $('#authDivider').hidden = false;
    }
  }).catch(() => {});

  // Acceso con Google (Supabase OAuth). Sirve igual para crear cuenta que
  // para entrar: si el correo ya existe, Supabase enlaza la identidad.
  $('#googleBtn').addEventListener('click', async () => {
    const g = $('#googleBtn');
    g.disabled = true;
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: location.origin + next },
    });
    if (error) {
      g.disabled = false;
      show(/not enabled|disabled|unsupported/i.test(error.message ?? '')
        ? 'El acceso con Google aún no está activado. Entra con tu correo mientras tanto.'
        : (error.message ?? 'No pudimos conectar con Google.'));
    }
    // Sin error no reactivamos el botón: el navegador ya va camino a Google.
  });

  // Si Google (o el usuario) cancela, Supabase regresa con el motivo en la
  // URL; lo mostramos en lugar de dejar la página en silencio.
  {
    const p = new URLSearchParams(location.search);
    const h = new URLSearchParams(location.hash.replace(/^#/, ''));
    const desc = p.get('error_description') || h.get('error_description');
    if (desc) show(decodeURIComponent(String(desc).replace(/\+/g, ' ')));
  }

  $('#magicLink').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = $('#email').value.trim();
    if (!email) return show('Escribe tu correo primero.');
    const { error } = await supabase.auth.signInWithOtp({
      email, options: { emailRedirectTo: location.origin + next },
    });
    show(error ? error.message : 'Te enviamos un enlace de acceso a tu correo.', !error);
  });

  // Recuperar contraseña. Respondemos igual exista o no la cuenta para no
  // revelar qué correos están registrados.
  $('#forgotLink').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = $('#email').value.trim();
    if (!email) return show('Escribe tu correo primero y vuelve a dar clic.');
    await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + '/nueva-contrasena',
    });
    show('Si ese correo tiene cuenta, te enviamos un enlace para crear una contraseña nueva.', true);
  });

  // El enlace de recuperación abre login.html con la sesión ya iniciada en
  // modo "recovery"; lo mandamos directo a elegir contraseña.
  supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') location.replace('/nueva-contrasena');
  });
</script>
</body>
</html>
